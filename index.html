:root{--bg:#eef5fb;--card:#ffffff;--tx:#10243a;--mut:#5b7189;--bd:#d3e2f0;--pri:#0a6cff;--navy:#062c52;--sea:#0e8fd6;--ok:#10a05a;--okbg:#dcf6e8;--no:#e8710a;--nobg:#ffeacf;--red:#e5383b;--yel:#ffc21a;--head:#0a4d8c;--headtx:#ffffff;--rowalt:#f5faff;--sky1:#6fcbff;--sky2:#bfe8ff;--sky3:#e6f6ff;--sun:#ffd23f;--halo:rgba(255,255,255,.45);--cloud:#ffffff}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Tahoma,sans-serif}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:34px;background:var(--sky1);clip-path:polygon(0 60%,8% 40%,17% 55%,27% 35%,37% 55%,47% 38%,57% 56%,67% 36%,77% 55%,87% 40%,100% 58%,100% 100%,0 100%)}

.logo{width:48px;height:48px;border-radius:12px;background:var(--yel);display:grid;place-items:center;flex:none}
h1{font-size:24px;margin:0;line-height:1.2;letter-spacing:.2px}
.sub{opacity:.88;font-size:13px;margin-top:2px}

.s1{background:var(--head)}.s2{background:var(--ok)}.s3{background:var(--no)}.s4{background:var(--red)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:1300px}

.port{display:inline-block;padding:1px 9px;border-radius:6px;background:var(--head);color:#fff;font-weight:700;font-size:12px}
.ves{font-weight:600}.rm{white-space:pre-line;min-width:220px;max-width:340px}.nw{white-space:nowrap}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.ok{background:var(--okbg);color:var(--ok)}.no{background:var(--nobg);color:var(--no)}

.foot{margin-top:14px;color:var(--mut);font-size:12px}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur=[];
function run(){
  const terms=$("q").value.toUpperCase().split(/[\s,;]+/).filter(Boolean);
  const fv=$("fv").value.trim().toUpperCase(),fy=$("fy").value.trim().toUpperCase(),fp=$("fd").value;
  const d1=$("dfrom").value,d2=$("dto").value,lo=d1||d2,hi=d2||d1;

  if(terms.length){
    for(const t of terms){
      const hit=DATA.filter(r=>r[0].includes(t));
      if(!hit.length)miss.push(t);
      for(const r of hit)if(!seen.has(r[0])&&ok(r)){seen.add(r[0]);res.push(r)}

  }else if(filt){for(const r of DATA)if(ok(r))res.push(r)}
  cur=res;
  const tb=$("tb"),body=tb.querySelector("tbody");
